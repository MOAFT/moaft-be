spring:
  datasource:
    url: jdbc:mysql://localhost:3306/moaft?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: moaft
    password: moaft
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:test-key}
        chat:
          model: gemini-3.5-flash-lite
